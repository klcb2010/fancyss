# 20250404
# by: hq450 
# mod by klcb2010 - 黑名单优先版本
# --------------------------------------------------------------------------------------------------
# 1. 此smartdns配置文件用于fancyss DNS分流解析，DNS解析行为：国外优先（默认用国外DNS解析，除了国内域名用国内DNS解析）
# 2. 具体：black_list 最优先走 gfw 组（代理），chnlist + white_list 由 chn 组解析，gfwlist 由 gfw 组解析，其余域名由 gfw 组解析
# 3. IPV6行为：开启 chn 组域名的 IPV6 解析和双栈优选，gfw 组+default 组域名关闭 IPV6 解析，IPV6 不可用时自动关闭所有 IPV6 特性
# 4. 如果不懂如何配置，请不要随意修改，不然可能导致本地 DNS 污染，或 DNS 无法解析，导致无法科学上网。
# 5. 如果修改请确保配置文件的监听端口为 7913，修改配置后，你需要重启 smartdns 或者整个插件，才能生效。
# 6. smartdns 相关文档请参考：https://github.com/pymumu/smartdns#smartdns
# --------------------------------------------------------------------------------------------------
# 优点: 国外 CDN 较好，且能做到 DNS 不泄露，因为非 chnlist 的域名都由国外 DNS 解析。
# 缺点: chnlist 未覆盖到的国内域名会走国外可信 DNS 解析，首次解析速度会慢一点点
# 建议: 使用大陆白名单模式/游戏模式的用户可以使用此模式。
# mod by klcb2010: 黑名单优先（black_list 先走代理），其他规则不变
# --------------------------------------------------------------------------------------------------
# 监听端口：7913，当启用替换 dnsmasq 时，此处会自动替换为端口 53
bind [::]:7913

# ------------ domain-set ---------------------
# chnlist，包含全部 cn 域名和近 10 万条非 cn 的国内域名：https://github.com/hq450/fancyss/blob/3.0/rules_ng/chnlist.gz
domain-set -name chnlist -file /tmp/chnlist.txt
# gfwlist，包含已知的被墙的域名：https://github.com/hq450/fancyss/blob/3.0/rules_ng/gfwlist.gz
domain-set -name gfwlist -file /tmp/gfwlist.txt
# rotlist，用于控制路由器自己的流量哪些域名走代理
domain-set -name rotlist -file /koolshare/ss/rules/rotlist.txt
# white_list，用户自定义的域名白名单，不走代理
domain-set -name white_list -file /tmp/white_list.txt
# black_list，用户自定义的域名黑名单，走代理（优先级最高）
domain-set -name black_list -file /tmp/black_list.txt
# block_list，需要屏蔽 dns 解析的域名名单，比如 adobe 相关域名，防止 adobe 软件弹非正版提示窗口
domain-set -name block_list -file /tmp/block_list.txt

# ------------ domain-rules ---------------------
# black_list 最优先：由 gfw 组服务器解析，关闭 IPV6，关闭测速
domain-rules /domain-set:black_list/ -p #4:black_list,#6:- -c none -a #6 -n gfw

# chnlist 域名由 chn 组服务器解析，对解析结果进行双栈 ip 优选，然后将结果写入 chnlist,chnlist6 的 ipset 里
domain-rules /domain-set:chnlist/ -p #4:chnlist,#6:chnlist6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# white_list 域名由 chn 组服务器解析，对解析结果进行双栈 ip 优选，然后将结果写入 white_list,white_list6 的 ipset 里
domain-rules /domain-set:white_list/ -p #4:white_list,#6:white_list6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# gfwlist 域名由 gfw 组服务器解析，解析结果写入 gfwlist 的 ipset 里，关闭测速模式，关闭 IPV6 解析
domain-rules /domain-set:gfwlist/ -p #4:gfwlist,#6:- -c none -a #6 -n gfw

# rotlist 域名由 gfw 组服务器解析，解析结果写入 router 的 ipset 里，关闭测速模式，关闭 IPV6 解析
domain-rules /domain-set:rotlist/ -p #4:router,#6:- -c none -a #6 -n gfw

# block_list 屏蔽 IPV4, IPV6 解析
domain-rules /domain-set:block_list/ -a #

# 设置全局规则。如果开启，则未匹配规则的 default 组将会被归到 gfw 组；如果未开启，则未匹配域名为 default 组
# domain-rules /./ -p #4:gfwlist,#6:- -c none -a #6 -n gfw

# 测速模式选择，由于默认为国外 dns 解析，故不开启测速
speed-check-mode none

# 缓存大小，自动控制
# cache-size 32768

# 缓存持久化
cache-persist yes

# 缓存文件，国外优先 cache 为 smartdns_2.cache
cache-file /tmp/smartdns_2.cache

# 开启域名预获取
prefetch-domain yes

# 启用过期缓存服务
serve-expired yes

# 缓存超时时间
serve-expired-ttl 259200

# 配置过期缓存响应 TTL (缓存中域名 TTL 超时时，返回给客户端的 TTL 时间，让客户端在下列 TTL 时间后再次查询)
serve-expired-reply-ttl 3

# cache 定时保存
cache-checkpoint-time 86400

# 禁用 IPV6 解析
force-AAAA-SOA no

# force specific qtype return soa
force-qtype-SOA 65

# 设置 TTL
# rr-ttl 1800

# 允许返回给客户的最大 IP 数量
# max-reply-ip-num 5

# 日志记录
log-level info
log-file /tmp/smartdns_log.txt
log-size 2M
log-num 1

# 审计
audit-enable yes
audit-file /tmp/smartdns_audit.txt
audit-size 2M
audit-num 1

# 证书文件
ca-file /etc/ssl/certs/ca-certificates.crt

#--------------------------------
# blacklist-ip 0.0.0.0/8
blacklist-ip 10.0.0.0/8
# blacklist-ip 127.0.0.0/8
# blacklist-ip ::/128
# blacklist-ip ::1/128
#--------------------------------

# define proxy server
proxy-server socks5://127.0.0.1:23456 -name fancy_proxy

# chn 组，国内上游服务器，走直连，用于解析 {chnlist, white_list} 的域名
# 1.加上 -exclude-default-group 参数，避免 {chnlist, white_list} 以外的域名通过 chn 组服务器查询
# 2.使用 -blacklist-ip，过滤一些解析结果，比如 127.0.0.1, 0.0.0.0 以及一些常见的污染 ip
# 3.使用尽可能多的上游 dns 服务器，以尽可能获得更多的解析结果，方便测速优选
# 4.如果插件内设置了：追加 ISP DNS，则 117.50.10.10 和 117.50.60.30 会在启动时自动替换为 ISP DNS
server 117.50.10.10 -group chn -blacklist-ip -exclude-default-group
server 117.50.60.30 -group chn -blacklist-ip -exclude-default-group
server 223.5.5.5 -group chn -blacklist-ip -exclude-default-group
server 119.29.29.29 -group chn -blacklist-ip -exclude-default-group
server 114.114.114.114 -group chn -blacklist-ip -exclude-default-group
server 180.184.1.1 -group chn -blacklist-ip -exclude-default-group
server 1.2.4.8 -group chn -blacklist-ip -exclude-default-group
server 180.76.76.76 -group chn -blacklist-ip -exclude-default-group

# gfw 组，国外上游服务器，走代理，用于解析 {gfwlist, black_list} 的域名
# 因未排除默认组，此组还会用于没有任何匹配的域名的 DNS 解析，此时 group 为 default
# 一般设置 tcp DNS，并走代理解析就能达到最佳的远端解析效果。
server-tcp 8.8.8.8 -group gfw -proxy fancy_proxy
server-tcp 1.1.1.1 -group gfw -proxy fancy_proxy

# dot server（可选）
# server-tls dns.google.com -group gfw -proxy fancy_proxy -host-ip 8.8.8.8
# server-tls one.one.one.one -group gfw -proxy fancy_proxy -host-ip 1.1.1.1

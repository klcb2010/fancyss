name: FancySS Mod Build test

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（增加 fetch-depth 确保 Git 历史完整）
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      # 2. 【核心修复】强制同步远程分支，彻底清理工作区
      - name: Force sync and clean workspace
        run: |
          echo "=== SYNCING WITH REMOTE ==="
          # 获取当前触发分支的最新状态
          git fetch origin ${{ github.ref_name }}
          # 强行重置，丢弃所有本地残留，确保 cron_task.txt 是最新的
          git reset --hard FETCH_HEAD
          git clean -fdx
          echo "=== WORKSPACE IS CLEAN AND FRESH ==="

      # 3. 修复子模块（全HTTPS）
      - name: Fix all submodules
        run: |
          rm -rf .git/modules
          git submodule deinit -f --all || true

          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://github.com/".insteadOf git@github1.com:

          sed -i 's#git@github1.com:#https://github.com/#g' .gitmodules
          sed -i 's#git@github.com:#https://github.com/#g' .gitmodules

          git submodule sync --recursive
          git submodule update --init --depth=1 || true

      # 4. 安装必备工具
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      # 5. Patch 规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 6. 【核心注入】使用已清理的本地文件进行幂等注入
      - name: Inject cron_task safely
        run: |
          TARGET="fancyss/ss/ssconfig.sh"
          
          # 验证文件内容（用于在日志中确认）
          echo "Current cron_task.txt content:"
          cat cron_task.txt
          
          # 删除旧注入块（幂等处理）
          sed -i '/# CUSTOM_INJECT_START/,/# CUSTOM_INJECT_END/d' "$TARGET"

          # 注入新内容
          {
            echo "# CUSTOM_INJECT_START"
            cat cron_task.txt
            echo "# CUSTOM_INJECT_END"
          } >> "$TARGET"
          
          echo "Injection completed."

      # 7. Git 环境配置
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 8. 同步 Changelog（放在注入之后，防止 commit 干扰 HEAD）
      - name: Sync upstream Changelog.txt
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0 || true
          git checkout upstream/3.0 -- Changelog.txt || true
          git add Changelog.txt || true
          # 使用 || true 避免没有更新时报错停止
          git commit -m "Sync upstream Changelog.txt" || echo "No changes to commit"

      # 9. 执行打包
      - name: Make scripts executable and Build
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      # 10. 生成 Release 信息
      - name: Generate release info
        id: release_info
        run: |
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "构建时间 ：${BUILD_TIME}" > release_body.txt
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 11. 发布到 Releases
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          files: packages/*.tar.gz
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

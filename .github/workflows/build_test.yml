name: FancySS Mod Build test

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点自动运行
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq 工具
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Patch ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 把 cron_task.txt 追加到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 5. 添加自定义日志消息（先删除旧的，再插入到固定位置）
      - name: Add custom injected tasks log message
        run: |
          # 先删除所有旧的自定义注入消息行（防止重复）
          sed -i '/系统及自定义任务已注入成功/d' fancyss/ss/ssconfig.sh || true
          sed -i '/定时任务已注入成功/d' fancyss/ss/ssconfig.sh || true
          
          # 在 "Across the Great Wall" 这一行上面插入新消息
          sed -i '/Across the Great Wall/i echo_date "================== 系统及自定义任务已注入成功 cru l 查看 =================="' fancyss/ss/ssconfig.sh

      # 6. 删除讨厌的多余通知
      - name: Remove annoying signature lines
        run: |
          sed -i '/Across the Great Wall/,/梅林固件 - 【科学上网】/d' fancyss/ss/ssconfig.sh || true

      # 8. 设置 build.sh 可执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh

      # 9. 执行打包，只保留 hnd / hnd_v8 full 包
      - name: Build FancySS packages
        run: |
          ./build.sh
        # 10. 获取上游版本并生成 release 描述（带日期）
      - name: Generate release body and tag
        id: release_info
        run: |
          # 从 build.sh 的 version 文件获取上游版本（假设 VERSION 在 fancyss/ss/version 第一行）
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r')
          TAG_NAME="v${UPSTREAM_VERSION}"
          RELEASE_NAME="FancySS v${UPSTREAM_VERSION}"
          BUILD_TIME=$(date +"%Y-%m-%d %H:%M:%S")
          BODY="FancySS v${UPSTREAM_VERSION}\n构建时间: ${BUILD_TIME}\npatched ss_rule_update.sh + ssconfig.sh cron + 自定义任务注入日志 + 删除通知 + smartdns_smrt_1.conf 替换\n\n附件：hnd / hnd_v8 full 包（覆盖最新）\n\nSupported platforms: hnd / hnd_v8"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT

      # 11. 创建/更新 Release（用上游版本作为 tag，覆盖同版本）
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true  # 同 tag 覆盖描述和附件

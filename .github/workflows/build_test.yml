name: FancySS Mod Build test

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点自动运行
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq 工具
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Patch ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 把 cron_task.txt 追加到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 5. Patch FancySS 日志消息 & 自定义注入 + 删除多余通知
      - name: Patch FancySS log messages
        run: |
          FILE="fancyss/ss/ssconfig.sh"
          echo "Patching FancySS log messages..."

          # 删除旧的自定义注入消息
          sed -i '/系统及自定义任务已注入成功/d' "$FILE" || true
          sed -i '/定时任务已注入成功/d' "$FILE" || true

          # 删除旧的分隔线和通知
          sed -i '/科学上网.*启动完毕/d' "$FILE" || true
          sed -i '/启动完毕.*科学上网/d' "$FILE" || true
          sed -i '/关闭.*科学上网/d' "$FILE" || true
          sed -i '/科学上网.*已关闭/d' "$FILE" || true
          sed -i '/启动.*科学上网/d' "$FILE" || true
          sed -i '/梅林固件.*科学上网/d' "$FILE" || true
          sed -i '/科学上网.*梅林固件/d' "$FILE" || true
          sed -i '/See you again!/d' "$FILE" || true
          sed -i '/---*.*科学上网.*---*/d' "$FILE" || true

          # 在 "Across the Great Wall" 上方插入新消息
          sed -i '/Across the Great Wall/i echo_date "================= SSH DDNS cru done ================"' "$FILE"

          # 统一替换日志内容
          declare -A log_replacements=(
            ["======================= 梅林固件 - 【科学上网】 ======================="]="================= 梅林固件科学上网=================="
            ["------------------------- 启动【科学上网】 -----------------------------"]="================= 开始启动科学上网=================="
            ["------------------------ 【科学上网】 启动完毕 ------------------------"]="================= 科学上网启动完毕 =================="
            ["------------------------- 关闭【科学上网】 -----------------------------"]="================= 成功关闭科学上网 =================="
            ["------------------------ 【科学上网】已关闭 ----------------------------"]="================= 科学 上网 已关闭=================="
            ["你已经成功关闭科学上网服务~"]="成功关闭科学上网"
          )

          for pattern in "${!log_replacements[@]}"; do
            replacement=${log_replacements[$pattern]}
            sed -i "s|$pattern|$replacement|g" "$FILE"
          done

          echo "Patch complete."

      # 6. 删除讨厌的多余通知（保留原逻辑）
      - name: Remove annoying signature lines
        run: |
          sed -i '/Across the Great Wall/,/梅林固件 - 【科学上网】/d' fancyss/ss/ssconfig.sh || true

      # 7. 设置 build.sh 可执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh

      # 8. 执行打包，只保留 hnd / hnd_v8 full 包
      - name: Build FancySS packages
        run: ./build.sh

      # 9. 获取上游版本 + 生成 release 描述（只保留北京时间）
      - name: Generate release body and tag
        id: release_info
        run: |
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "构建时间 ：${BUILD_TIME}" > release_body.txt

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 10. 创建/更新 Release（用版本号作为 tag，覆盖同版本）
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true

name: FancySS Mod Build test
on:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨3点自动运行
  workflow_dispatch: # 支持手动触发
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq 工具
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Patch ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 把 cron_task.txt 追加到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 5. 设置 build.sh 可执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh
      # 6.1 添加上游仓库 remote 并 fetch Changelog.txt（放在 build.sh 之前）
      - name: Add upstream and fetch Changelog.txt
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0 || true
          git checkout upstream/3.0 -- Changelog.txt || true
          git add Changelog.txt || true
          git commit -m "Sync upstream Changelog.txt" || echo "Changelog.txt 无变更"


      # 6.2 执行打包，只保留 hnd / hnd_v8 full 包 + 同步 Changelog.txt
      - name: Build FancySS packages
        run: |
          ./build.sh
          
      # 7. 获取上游版本 + 生成 release 描述（只保留北京时间）
      - name: Generate release body and tag
        id: release_info
        run: |
          # 获取上游版本（从 fancyss/ss/version 第一行）
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g') # 清理非数字/点字符
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          # body 只保留时间一行
          echo "构建时间 ：${BUILD_TIME}" > release_body.txt
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 8. 创建/更新 Release（用版本号作为 tag，覆盖同版本）
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true # 同版本覆盖描述和附件

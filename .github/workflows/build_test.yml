name: FancySS Mod Build test

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点自动运行
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq 工具
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Patch ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 把 cron_task.txt 追加到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 5. 添加自定义日志消息 + 安全美化启动/关闭/标题提示 + 删除多余通知
      - name: Add custom injected tasks log message
        run: |
          # 先删除所有旧的自定义注入消息行（防止重复）
          sed -i '/系统及自定义任务已注入成功/d' fancyss/ss/ssconfig.sh || true
          sed -i '/定时任务已注入成功/d' fancyss/ss/ssconfig.sh || true

          # 安全替换 echo_date 后的内容（只改双引号内字符串，不动行尾语法结构）
          # 1. 启动完毕（两处）
          sed -i '/echo_date.*科学上网.*启动完毕/s/"[^"]*"/"================= 科学上网启动完毕 =================="/g' fancyss/ss/ssconfig.sh || true

          # 2. 关闭科学上网（包括 ------------------------ 【科学上网】已关闭 ----------------------------）
          sed -i '/echo_date.*关闭.*科学上网/s/"[^"]*"/"================= 成功关闭科学上网 =================="/g' fancyss/ss/ssconfig.sh || true

          # 3. 启动科学上网（一处）
          sed -i '/echo_date.*启动.*科学上网/s/"[^"]*"/"================= 开始启动科学上网 =================="/g' fancyss/ss/ssconfig.sh || true

          # 4. 梅林固件标题（一处）
          sed -i '/echo_date.*梅林固件.*科学上网/s/"[^"]*"/"================= 梅林固件科学上网=================="/g' fancyss/ss/ssconfig.sh || true

          # 5. 删除 "See you again!" 这条通知（只删 echo_date 行，保留结构）
          sed -i '/echo_date.*See you again!/d' fancyss/ss/ssconfig.sh || true

          # 6. 在 "Across the Great Wall" 这一行上面插入新消息
          sed -i '/Across the Great Wall/i echo_date "================== 系统及自定义任务已注入成功 cru l 查看 =================="' fancyss/ss/ssconfig.sh || true

      
      # 6. 删除讨厌的多余通知
      - name: Remove annoying signature lines
        run: |
          sed -i '/Across the Great Wall/,/梅林固件 - 【科学上网】/d' fancyss/ss/ssconfig.sh || true

      # 8. 设置 build.sh 可执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh

      # 9. 执行打包，只保留 hnd / hnd_v8 full 包
      - name: Build FancySS packages
        run: |
          ./build.sh
           # 10. 获取上游版本 + 生成 release 描述（只保留北京时间）
      - name: Generate release body and tag
        id: release_info
        run: |
          # 获取上游版本（从 fancyss/ss/version 第一行）
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')  # 清理非数字/点字符
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          # body 只保留时间一行
          echo "构建时间 ：${BUILD_TIME}" > release_body.txt

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 11. 创建/更新 Release（用版本号作为 tag，覆盖同版本）
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true  # 同版本覆盖描述和附件

name: FancySS Component Update Test Build

on:
  push:
    branches:
      - "test/component-updates-2026-11"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fancyss-component-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl xz-utils

      - name: Setup Go for AnyTLS client
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: false

      - name: Build patched AnyTLS client
        run: |
          chmod +x binaries/anytls-go/build.sh
          ./binaries/anytls-go/build.sh

      - name: Build test packages
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      - name: Upload test packages (no release)
        uses: actions/upload-artifact@v4
        with:
          name: fancyss-component-test-${{ github.sha }}
          path: |
            packages/*.tar.gz
            packages/version.json.js
          if-no-files-found: error
          retention-days: 14

name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # =========================
      # 2. git config
      # =========================
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # =========================
      # 3. upstream
      # =========================
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0 --no-tags

      # =========================
      # 4. version compare
      # =========================
      - name: Compare version
        id: compare_version
        run: |
          set -e

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o /tmp/upstream_version.json.js

          LOCAL_VERSION=$(jq -r '.version' packages/version.json.js)
          UPSTREAM_VERSION=$(jq -r '.version' /tmp/upstream_version.json.js)

          echo "local=$LOCAL_VERSION"
          echo "upstream=$UPSTREAM_VERSION"

          # version compare
          if [ "$(printf '%s\n%s' "$LOCAL_VERSION" "$UPSTREAM_VERSION" | sort -V | head -n1)" = "$LOCAL_VERSION" ] \
            && [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 5. skip
      # =========================
      - name: Skip if no update
        if: steps.compare_version.outputs.needs_sync == 'false'
        run: |
          echo "已是最新版本"
          exit 0

      # =========================
      # 6. sync upstream
      # =========================
      - name: Sync upstream repository
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}

          git reset --hard
          git clean -fdx

          OLD_HEAD=$(git rev-parse HEAD)

          if ! git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories; then
            git checkout --ours build-custom.sh || true
            git add build-custom.sh || true
            git commit -m "resolve conflicts"
          fi

          git restore --source=$OLD_HEAD \
            .github/workflows/ \
            cron_task.txt \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            clear.py || true

      # =========================
      # 7. FORCE FIX VERSION（关键修复点）
      # =========================
      - name: Sync version file
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o packages/version.json.js

          echo "✔ version.json.js 已同步"
          cat packages/version.json.js

      # =========================
      # 8. install jq
      # =========================
      - name: Install jq
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # 9. patch script
      # =========================
      - name: Patch ss_rule_update.sh
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' \
            fancyss/scripts/ss_rule_update.sh

      # =========================
      # 10. inject cron (防重复)
      # =========================
      - name: Inject cron_task safely
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          TARGET="fancyss/ss/ssconfig.sh"

          sed -i '/# CUSTOM_INJECT_START/,/# CUSTOM_INJECT_END/d' "$TARGET"

          {
            echo ""
            echo "# CUSTOM_INJECT_START"
            cat cron_task.txt
            echo "# CUSTOM_INJECT_END"
          } >> "$TARGET"

      # =========================
      # 11. commit fix
      # =========================
      - name: Commit & Push
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          grep -qxF "release_body.txt" .gitignore || echo "release_body.txt" >> .gitignore

          git rm -f --cached release_body.txt 2>/dev/null || true

          git add -A
          git add .gitmodules 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream + fix version + inject cron"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
          fi

      # =========================
      # 12. build
      # =========================
      - name: Build packages
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      # =========================
      # 13. release info（安全版）
      # =========================
      - name: Generate release info
        if: steps.compare_version.outputs.needs_sync == 'true'
        id: release_info
        run: |
          VERSION=$(jq -r '.version' packages/version.json.js)

          # 防空
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version error"
            exit 1
          fi

          TAG_NAME="v${VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${VERSION}" >> $GITHUB_OUTPUT
          echo "body=构建时间：${BUILD_TIME}" >> $GITHUB_OUTPUT

      # =========================
      # 14. release
      # =========================
      - name: Create Release
        if: steps.compare_version.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          files: packages/*.tar.gz
          overwrite_files: true
          make_latest: true
          generate_release_notes: false

name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: '10 19 * * *'  # 每天凌晨3点自动运行（北京时间3:10点）
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 push 和 release

    steps:
      # 步骤 1: 拉取当前仓库代码
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 步骤 2: 配置 git 用户信息
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # 步骤 3: 添加上游仓库并 fetch
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream --no-tags

      # 步骤 4: 对比 fancyss/ 目录最后提交时间（东八区时间）
      - name: Compare fancyss directory last commit time
        id: compare_time
        run: |
          UPSTREAM_TIME=$(git log upstream/3.0 --pretty=format:%ct -- fancyss | head -n 1)
          CURRENT_TIME=$(git log HEAD --pretty=format:%ct -- fancyss | head -n 1)
          
          UPSTREAM_CST_TIME=$((UPSTREAM_TIME + 28800))
          CURRENT_CST_TIME=$((CURRENT_TIME + 28800))
          
          UPSTREAM_DATE=$(date -d "@$UPSTREAM_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          CURRENT_DATE=$(date -d "@$CURRENT_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          
          echo "上游 fancyss/ 最后提交时间: $UPSTREAM_DATE"
          echo "当前 fancyss/ 最后提交时间: $CURRENT_DATE"
          
          if [ -z "$UPSTREAM_TIME" ] || [ -z "$CURRENT_TIME" ]; then
            echo "无法获取时间戳，强制同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TIME" -gt "$CURRENT_TIME" ]; then
            echo "上游有更新，需要同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "上游无更新，跳过"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # 步骤 5: 如果上游无更新，直接结束流程
      - name: Skip if no update
        if: steps.compare_time.outputs.needs_sync == 'false'
        run: |
          echo "上游 fancyss 目录无更新，流程结束"
          exit 0

      # 步骤 6: 同步上游代码并推送（合并 fancyss/ + Changelog.txt）
      - name: Sync upstream repository and push
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          git checkout -b upstream-sync upstream/3.0
          git checkout ${{ github.ref_name }}
          git merge upstream-sync -X theirs --no-edit --allow-unrelated-histories || true
          
          # 同步上游 Changelog.txt 到根目录
          git checkout upstream/3.0 -- Changelog.txt || true
          git add Changelog.txt || true
          
          git checkout HEAD -- .github/workflows/ README.md cron_task.txt || true
          git add .
          git commit -m "Sync upstream hq450/fancyss@3.0 (fancyss directory + Changelog.txt updated)" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} --force-with-lease
      # 步骤 7: 安装 jq
      - name: Install jq
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # 步骤 8: Patch ss_rule_update.sh
      - name: Patch ss_rule_update.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 步骤 9: 追加 cron_task.txt 到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 步骤 10: 设置 build.sh 可执行权限
      - name: Make build.sh executable
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: chmod +x build.sh

      # 步骤 11: 执行打包（只打包 hnd / hnd_v8 full 包）
      - name: Build FancySS packages
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          ./build.sh

      # 步骤 12: 获取上游版本 + 生成 release 描述（只保留北京时间）
      - name: Generate release body and tag
        if: steps.compare_time.outputs.needs_sync == 'true'
        id: release_info
        run: |
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          echo "构建时间（北京时间）：${BUILD_TIME}" > release_body.txt
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 步骤 13: 创建/更新 Release（用版本号作为 tag，覆盖同版本）
      - name: Create/Update Release
        if: steps.compare_time.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true

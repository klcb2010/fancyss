name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git
          git fetch upstream --no-tags

      - name: Compare fancyss directory last commit time
        id: compare_time
        run: |
          UPSTREAM_TIME=$(git log upstream/3.0 --pretty=format:%ct -- fancyss | head -n 1)
          CURRENT_TIME=$(git log HEAD --pretty=format:%ct -- fancyss | head -n 1)
          echo "上游 fancyss/ 最后提交时间戳: $UPSTREAM_TIME"
          echo "当前仓库 fancyss/ 最后提交时间戳: $CURRENT_TIME"
          if [ -z "$UPSTREAM_TIME" ] || [ -z "$CURRENT_TIME" ]; then
            echo "无法获取时间戳，强制同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TIME" -gt "$CURRENT_TIME" ]; then
            echo "上游有更新，需要同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "上游无更新，跳过"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no update
        if: steps.compare_time.outputs.needs_sync == 'false'
        run: |
          echo "上游 fancyss 目录无更新，流程结束"
          exit 0

      - name: Sync upstream repository and push
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          git checkout -b upstream-sync upstream/3.0
          git checkout ${{ github.ref_name }}
          git merge upstream-sync -X theirs --no-edit --allow-unrelated-histories || true
          git checkout HEAD -- .github/workflows/ README.md cron_task.txt || true
          git add .
          git commit -m "Sync upstream hq450/fancyss@3.0 (fancyss directory updated)" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} --force-with-lease

      - name: Install jq
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Patch ss_rule_update.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      - name: Append cron_task.txt to ssconfig.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      - name: Add custom injected tasks log message
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '/系统及自定义任务已注入成功/d' fancyss/ss/ssconfig.sh || true
          sed -i '/定时任务已注入成功/d' fancyss/ss/ssconfig.sh || true
          sed -i '/Across the Great Wall/i echo_date "================== 系统及自定义任务已注入成功 cru l 查看 =================="' fancyss/ss/ssconfig.sh

      - name: Remove annoying signature lines
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '/Across the Great Wall/,/梅林固件 - 【科学上网】/d' fancyss/ss/ssconfig.sh || true

      - name: Make build.sh executable
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: chmod +x build.sh

      - name: Build FancySS packages
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          ./build.sh
          find packages -type f ! -name "fancyss_hnd_full.tar.gz" ! -name "fancyss_hnd_v8_full.tar.gz" -delete

      - name: Generate release body
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          echo "编译版本 build $(date +%y%m%d): synced upstream fancyss + patched + custom log + removed signature" > release_body.txt

      - name: Create/Update Release
        if: steps.compare_time.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: mod
          name: FancySS mod build
          body_path: release_body.txt
          make_latest: true
          generate_release_notes: false
          files: |
            packages/fancyss_hnd_full.tar.gz
            packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true

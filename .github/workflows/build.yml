name: FancySS Auto Build

on:
  schedule:
    # 每三天凌晨 3 点触发
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  build-fancyss:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你 fork 的仓库
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. 添加 upstream 并 fetch
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0

      # 3. 检查是否有更新
      - name: Check for updates
        id: check_update
        run: |
          UPSTREAM_HASH=$(git rev-parse upstream/3.0)
          LOCAL_HASH=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          echo "local=$LOCAL_HASH" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # 4. 跳过无更新情况
      - name: Skip if no update
        if: ${{ steps.check_update.outputs.no_changes == 'true' }}
        run: |
          echo "No upstream updates, skipping build."
          exit 0

      # 5. 有更新 → 合并 upstream
      - name: Merge upstream
        if: ${{ steps.check_update.outputs.no_changes == 'false' }}
        run: |
          git merge upstream/3.0 --ff-only

      # 6. 插入自定义 cron_task.txt
      - name: Insert custom cron task
        if: ${{ steps.check_update.outputs.no_changes == 'false' }}
        run: |
          # 删除原有 CUSTOM CRON TASK 块
          sed -i '/# BEGIN CUSTOM CRON TASK/,/# END CUSTOM CRON TASK/d' fancyss/ss/ssconfig.sh
          # 追加 cron_task.txt 到末尾
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 7. 构建 fancyss 插件
      - name: Build FancySS plugin
        if: ${{ steps.check_update.outputs.no_changes == 'false' }}
        run: |
          cd fancyss
          sh build.sh

      # 8. 上传到 Releases mod 版本
      - name: Upload to GitHub Release
        if: ${{ steps.check_update.outputs.no_changes == 'false' }}
        uses: ncipollo/release-action@v1
        with:
          tag: mod
          name: FancySS-mod
          files: fancyss/packages/*

name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: '10 19 * * *' # 每天凌晨3点自动运行（北京时间3:10点）
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fix all submodule URLs (safe, no commit check)
        run: |
          rm -rf .git/modules
          git submodule deinit -f --all || true
          git config -f .gitmodules submodule.tool/geotool.url https://github.com/hq450/geotool.git
          git config -f .gitmodules submodule.tool/xapi-tool.url https://github.com/hq450/xapi-tool.git
          git config -f .gitmodules submodule.tool/node-tool.url https://github.com/hq450/node-tool.git
          git config -f .gitmodules submodule.tool/sub-tool.url https://github.com/hq450/sub-tool.git
          git submodule sync --recursive
          git -c protocol.file.allow=always submodule update --init --depth=1 || true

      # 2. git config
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # 3. upstream
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream --no-tags

      # 4. compare time
      - name: Compare fancyss directory last commit time
        id: compare_time
        run: |
          set -e
          UPSTREAM_TIME=$(git log upstream/3.0 --pretty=format:%ct -- fancyss | head -n 1 || true)
          CURRENT_TIME=$(git log HEAD --pretty=format:%ct -- fancyss | head -n 1 || true)
          UPSTREAM_TIME=${UPSTREAM_TIME:-0}
          CURRENT_TIME=${CURRENT_TIME:-0}
          UPSTREAM_CST_TIME=$((UPSTREAM_TIME + 28800))
          CURRENT_CST_TIME=$((CURRENT_TIME + 28800))
          UPSTREAM_DATE=$(date -d "@$UPSTREAM_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          CURRENT_DATE=$(date -d "@$CURRENT_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          echo "上游 fancyss/ 最后提交时间: $UPSTREAM_DATE"
          echo "当前 fancyss/ 最后提交时间: $CURRENT_DATE"
          if [ "$UPSTREAM_TIME" -eq 0 ] && [ "$CURRENT_TIME" -eq 0 ]; then
            echo "无法获取时间戳，强制同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TIME" -gt "$CURRENT_TIME" ]; then
            echo "上游有更新，需要同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "上游无更新，跳过"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # 5. skip
      - name: Skip if no update
        if: steps.compare_time.outputs.needs_sync == 'false'
        run: |
          echo "上游 fancyss 目录无更新，流程结束"
          exit 0

      # ==================== 修正后的步骤 6 ====================
      - name: Sync upstream repository and push
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}
          OLD_HEAD=$(git rev-parse HEAD)

          # 提前处理 .gitmodules 冲突（最常见问题）
          git checkout --ours .gitmodules || true
          git add .gitmodules || true

          # 执行合并
          git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories || {
            echo "❌ merge 失败，尝试解决冲突..."
            git checkout --ours .gitmodules || true
            git add .gitmodules || true
            git -c core.editor=true merge --continue || {
              echo "❌ 无法自动解决冲突，终止流程"
              exit 1
            }
          }

          # 强制恢复自定义文件
          echo ">>> 恢复本地保护文件..."
          git restore --source=$OLD_HEAD \
            README.md \
            .github/workflows/ \
            cron_task.txt \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            clear.py || echo "部分文件恢复完成"

          # 提交推送
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream hq450/fancyss@3.0 (resolved .gitmodules + protected custom files)"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
            echo "✅ 同步并推送成功"
          else
            echo "已是最新，无需提交推送"
          fi
      # ==================== 步骤 6 结束 ====================

      # 7. jq
      - name: Install jq
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # 8. patch
      - name: Patch ss_rule_update.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 9. cron
      - name: Append cron_task.txt to ssconfig.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 10. chmod
      - name: Make build-custom.sh executable
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: chmod +x build-custom.sh

      # 11. build
      - name: Build FancySS packages
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          ./build-custom.sh

      # 12. release info
      - name: Generate release body and tag
        if: steps.compare_time.outputs.needs_sync == 'true'
        id: release_info
        run: |
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          echo "构建时间（北京时间）：${BUILD_TIME}" > release_body.txt
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # 13. release
      - name: Create/Update Release
        if: steps.compare_time.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true

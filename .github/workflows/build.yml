name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: '10 19 * * *'  # 每天凌晨3点自动运行（北京时间3:10点）
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 push 和 release

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Fix all submodule URLs (safe, no commit check)
        run: |
         # 清除旧子模块缓存（彻底干净）
         rm -rf .git/modules
         git submodule deinit -f --all || true

         # ====== 强制修正所有子模块 URL（关键点） ======
         git config -f .gitmodules submodule.tool/geotool.url https://github.com/hq450/geotool.git
         git config -f .gitmodules submodule.tool/xapi-tool.url https://github.com/hq450/xapi-tool.git
         git config -f .gitmodules submodule.tool/node-tool.url https://github.com/hq450/node-tool.git
         git config -f .gitmodules submodule.tool/sub-tool.url https://github.com/hq450/sub-tool.git

         # 同步配置
         git submodule sync --recursive

         # 初始化（浅克隆 + 不递归，避免旧 commit 校验炸）
         git -c protocol.file.allow=always submodule update --init --depth=1 || true

         # ====== 兜底（防止某些子模块还是失败）======
         [ -d "tool/geotool" ] || git clone --depth=1 https://github.com/hq450/geotool tool/geotool || true
         [ -d "tool/xapi-tool" ] || git clone --depth=1 https://github.com/hq450/xapi-tool tool/xapi-tool || true
         [ -d "tool/node-tool" ] || git clone --depth=1 https://github.com/hq450/node-tool tool/node-tool || true
         [ -d "tool/sub-tool" ] || git clone --depth=1 https://github.com/hq450/sub-tool tool/sub-tool || true
      # 步骤 2: 配置 git 用户信息
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # 步骤 3: 添加上游仓库并 fetch
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream --no-tags

      # 步骤 4: 对比 fancyss/ 目录最后提交时间（东八区时间）
      - name: Compare fancyss directory last commit time
        id: compare_time
        run: |
          UPSTREAM_TIME=$(git log upstream/3.0 --pretty=format:%ct -- fancyss | head -n 1)
          CURRENT_TIME=$(git log HEAD --pretty=format:%ct -- fancyss | head -n 1)
          
          UPSTREAM_CST_TIME=$((UPSTREAM_TIME + 28800))
          CURRENT_CST_TIME=$((CURRENT_TIME + 28800))
          
          UPSTREAM_DATE=$(date -d "@$UPSTREAM_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          CURRENT_DATE=$(date -d "@$CURRENT_CST_TIME" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "未知时间")
          
          echo "上游 fancyss/ 最后提交时间: $UPSTREAM_DATE"
          echo "当前 fancyss/ 最后提交时间: $CURRENT_DATE"
          
          if [ -z "$UPSTREAM_TIME" ] || [ -z "$CURRENT_TIME" ]; then
            echo "无法获取时间戳，强制同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TIME" -gt "$CURRENT_TIME" ]; then
            echo "上游有更新，需要同步"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "上游无更新，跳过"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # 步骤 5: 如果上游无更新，直接结束流程
      - name: Skip if no update
        if: steps.compare_time.outputs.needs_sync == 'false'
        run: |
          echo "上游 fancyss 目录无更新，流程结束"
          exit 0

               # 步骤 6: 同步上游代码并推送（重点保护 build-custom.sh）
      - name: Sync upstream repository and push
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          # 1. 切换到当前分支
          git checkout ${{ github.ref_name }}

          # 2. 记录当前 HEAD（用于后续恢复）
          OLD_HEAD=$(git rev-parse HEAD)

          # 3. 先 commit 本地对 .gitmodules 的修改（避免被 merge 覆盖）
          if git diff --quiet .gitmodules; then
            echo "No changes in .gitmodules"
          else
            git add .gitmodules
            git commit -m "Update submodule URLs before sync" || true
          fi

          # 4. 合并上游代码（上游优先）
          git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories || {
            echo "❌ merge 失败，终止流程"
            exit 1
          }

          # 5. 强制恢复我们自己的重要文件（核心保护）
          echo ">>> 恢复本地保护文件..."
          git restore --source=$OLD_HEAD \
            README.md \
            .github/workflows/ \
            cron_task.txt \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            mod.sh \
            clear.py || echo "部分文件恢复完成"

          # 6. 提交并推送（只有实际变化才提交）
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream hq450/fancyss@3.0 (protected custom files)"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
            echo "✅ 已同步上游并推送保护文件"
          else
            echo "已是最新，无需提交推送"
          fi

        #  步骤 7: 安装 jq
      - name: Install jq
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # 步骤 8: Patch ss_rule_update.sh
      - name: Patch ss_rule_update.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

    # 步骤 9: 追加 cron_task.txt 到 ssconfig.sh
      - name: Append cron_task.txt to ssconfig.sh
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
         cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 步骤 10: 设置 build-custom.sh 可执行权限
      - name: Make build-custom.sh executable
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: chmod +x build-custom.sh

      # 步骤 11: 执行打包（只打包 hnd / hnd_v8 full 包）
      - name: Build FancySS packages
        if: steps.compare_time.outputs.needs_sync == 'true'
        run: |
          ./build-custom.sh

      # 步骤 12: 获取上游版本 + 生成 release 描述（只保留北京时间）
      - name: Generate release body and tag
        if: steps.compare_time.outputs.needs_sync == 'true'
        id: release_info
        run: |
          UPSTREAM_VERSION=$(cat fancyss/ss/version | sed -n 1p | tr -d '\n\r' | sed 's/[^0-9.]//g')
          TAG_NAME="v${UPSTREAM_VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          echo "构建时间（北京时间）：${BUILD_TIME}" > release_body.txt
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

       # 步骤 13: 创建/更新 Release（用版本号作为 tag，覆盖同版本）
      - name: Create/Update Release
        if: steps.compare_time.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true

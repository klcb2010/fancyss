name: FancySS Sync & Build

on:
  schedule:
    - cron: '0 3 */3 * *' # 每3天凌晨3点
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1）拉取你的 fork
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2）添加 upstream 并 fetch
      - name: Fetch upstream fancyss
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0

      # 3）检查是否有上游更新
      - name: Check upstream updates
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/3.0)
          LOCAL=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # 4）如果没有更新，则结束
      - name: Skip build if no updates
        if: ${{ steps.check.outputs.no_changes == 'true' }}
        run: |
          echo "No upstream changes, skipping build."
          exit 0

      # 5）合并上游
      - name: Merge upstream
        if: ${{ steps.check.outputs.no_changes == 'false' }}
        run: |
          git merge upstream/3.0 --ff-only

      # 6）插入 cron 任务
      - name: Apply custom cron task
        if: ${{ steps.check.outputs.no_changes == 'false' }}
        run: |
          sed -i '/# BEGIN CUSTOM CRON TASK/,/# END CUSTOM CRON TASK/d' fancyss/ss/ssconfig.sh
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 7）执行 build.sh（根目录）
      - name: Build plugin
        if: ${{ steps.check.outputs.no_changes == 'false' }}
        run: |
          sh build.sh

      # 8）发布到 Release tag=mod
      - name: Publish to Release
        if: ${{ steps.check.outputs.no_changes == 'false' }}
        uses: ncipollo/release-action@v1
        with:
          tag: mod
          name: FancySS mod build
          files: |
            packages/*.tar.gz
            packages/*.zip

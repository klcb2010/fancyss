name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream --no-tags

      - name: Compare version
        id: compare_version
        run: |
          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js -o /tmp/upstream.json.js
          LOCAL_VERSION=$(jq -r '.version' packages/version.json.js)
          UPSTREAM_VERSION=$(jq -r '.version' /tmp/upstream.json.js)
          if [ "$(printf '%s\n%s' "$LOCAL_VERSION" "$UPSTREAM_VERSION" | sort -V | head -n1)" = "$LOCAL_VERSION" ] && [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync upstream
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}
          git reset --hard
          git clean -fd
          OLD_HEAD=$(git rev-parse HEAD)
          if ! git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories; then
            git checkout --ours build-custom.sh || true
            git add build-custom.sh || true
            git commit -m "resolve conflicts"
          fi
          git restore --source=$OLD_HEAD .github/workflows/ cron_task.txt build-custom.sh white_list.txt black_list.txt ss_update.sh README.md clear.py || true

      - name: Install jq
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Patch scripts
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      - name: Dynamic Inject cron_task
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          TARGET="fancyss/ss/ssconfig.sh"
          sed -i '/# CUSTOM_INJECT_START/,/# CUSTOM_INJECT_END/d' "$TARGET"
          {
            echo ""
            echo "# CUSTOM_INJECT_START"
            cat cron_task.txt
            echo "# CUSTOM_INJECT_END"
          } >> "$TARGET"

      - name: Commit & Push
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          grep -qxF "release_body.txt" .gitignore || echo "release_body.txt" >> .gitignore
          git rm -f --cached release_body.txt 2>/dev/null || true
          git add -A ':!release_body.txt' ':!*.log'
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream and apply custom patches"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
          fi

      - name: Build
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      - name: Get version and build time
        if: steps.compare_version.outputs.needs_sync == 'true'
        id: get_meta
        run: |
          echo "version=$(jq -r '.version' packages/version.json.js)" >> $GITHUB_OUTPUT
          echo "build_time=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Release
        if: steps.compare_version.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: v${{ steps.get_meta.outputs.version }}
          name: FancySS v${{ steps.get_meta.outputs.version }}
          body: "构建时间：${{ steps.get_meta.outputs.build_time }}"
          files: packages/*.tar.gz
          overwrite_files: true

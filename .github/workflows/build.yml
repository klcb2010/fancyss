name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # =========================
      # 2. Fix submodules
      # =========================
      - name: Fix all submodule URLs
        run: |
          rm -rf .git/modules
          git submodule deinit -f --all || true

          git config -f .gitmodules submodule.tool/geotool.url https://github.com/hq450/geotool.git
          git config -f .gitmodules submodule.tool/xapi-tool.url https://github.com/hq450/xapi-tool.git
          git config -f .gitmodules submodule.tool/node-tool.url https://github.com/hq450/node-tool.git
          git config -f .gitmodules submodule.tool/sub-tool.url https://github.com/hq450/sub-tool.git

          git submodule sync --recursive
          git -c protocol.file.allow=always submodule update --init --depth=1 || true

      # =========================
      # 3. git config
      # =========================
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # =========================
      # 4. upstream
      # =========================
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream --no-tags

      # =========================
      # 5. version compare
      # =========================
      - name: Compare version.json.js
        id: compare_version
        run: |
          set -e

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o /tmp/upstream_version.json.js

          LOCAL_VERSION=$(jq -r '.version' packages/version.json.js)
          UPSTREAM_VERSION=$(jq -r '.version' /tmp/upstream_version.json.js)

          echo "local=$LOCAL_VERSION"
          echo "upstream=$UPSTREAM_VERSION"

          if [ "$(printf '%s\n%s' "$LOCAL_VERSION" "$UPSTREAM_VERSION" | sort -V | head -n1)" = "$LOCAL_VERSION" ] \
            && [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 6. skip
      # =========================
      - name: Skip if no update
        if: steps.compare_version.outputs.needs_sync == 'false'
        run: |
          echo "已是最新，无需同步"
          exit 0

      # =========================
      # 7. merge upstream
      # =========================
      - name: Sync upstream repository
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}
          OLD_HEAD=$(git rev-parse HEAD)

          if ! git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories; then
            git checkout --ours .gitmodules build-custom.sh || true
            git add .gitmodules build-custom.sh || true

            git ls-files -u | cut -f2 | sort -u | while read file; do
              git checkout --ours "$file" || true
              git add "$file" || true
            done

            git commit -m "resolve conflicts"
          fi

          git restore --source=$OLD_HEAD \
            .gitmodules \
            .github/workflows/ \
            cron_task.txt \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            clear.py || true

      # =========================
      # 8. jq
      # =========================
      - name: Install jq
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      # =========================
      # 9. patch
      # =========================
      - name: Patch ss_rule_update.sh
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' \
            fancyss/scripts/ss_rule_update.sh

      # =========================
      # 10. append cron
      # =========================
      - name: Append cron_task.txt to ssconfig.sh
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # =========================
      # 11. commit（修复点）
      # =========================
      - name: Commit & Push
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          # 在 merge 后再改 .gitignore（避免污染工作区）
          grep -qxF "release_body.txt" .gitignore || echo "release_body.txt" >> .gitignore

          # 移除历史跟踪
          git rm -f --cached release_body.txt 2>/dev/null || true

          # add（排除临时文件）
          git add -A \
            -- ':!release_body.txt' \
            -- ':!*.log' \
            -- ':!*.tmp'

          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream hq450/fancyss@3.0"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
            echo "已提交并推送"
          else
            echo "已是最新，无需提交推送"
          fi

      # =========================
      # 12. build
      # =========================
      - name: Make build-custom.sh executable
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: chmod +x build-custom.sh

      - name: Build FancySS packages
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          ./build-custom.sh

      # =========================
      # 13. release info
      # =========================
      - name: Generate release body and tag
        if: steps.compare_version.outputs.needs_sync == 'true'
        id: release_info
        run: |
          VERSION=$(jq -r '.version' packages/version.json.js)
          TAG_NAME="v${VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "构建时间：${BUILD_TIME}" > release_body.txt

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${VERSION}" >> $GITHUB_OUTPUT
          echo "body=$(cat release_body.txt)" >> $GITHUB_OUTPUT

      # =========================
      # 14. release
      # =========================
      - name: Create/Update Release
        if: steps.compare_version.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          make_latest: true
          generate_release_notes: false
          files: packages/*.tar.gz
          overwrite_files: true

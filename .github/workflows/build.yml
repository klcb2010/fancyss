name: FancySS Mod Build by klcb2010

on:
  schedule:
    - cron: "10 15 * * *"
  push:
    branches:
      - "security/xray-mptcp-2026"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # =========================
      # 2. git config
      # =========================
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # =========================
      # 3. upstream
      # =========================
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0 --no-tags

      # =========================
      # 4. version compare
      # =========================
      - name: Compare version
        id: compare_version
        run: |
          set -e

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o /tmp/up_version.json.js

          LOCAL_VERSION=$(jq -r '.version' packages/version.json.js)
          UPSTREAM_VERSION=$(jq -r '.version' /tmp/up_version.json.js)

          echo "local=$LOCAL_VERSION"
          echo "upstream=$UPSTREAM_VERSION"

          if [ "$(printf '%s\n%s' "$LOCAL_VERSION" "$UPSTREAM_VERSION" | sort -V | head -n1)" = "$LOCAL_VERSION" ] \
            && [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 5. decide whether to build
      # =========================
      - name: Determine build requirement
        id: build_decision
        run: |
          if [ "${{ steps.compare_version.outputs.needs_sync }}" = "true" ] || \
             [ "${GITHUB_EVENT_NAME}" = "push" ] || \
             [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "本地提交、手动触发或上游更新，执行构建"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "定时检查：上游版本无更新，跳过构建"
          fi

      # =========================
      # 6. skip
      # =========================
      - name: Skip if no build needed
        if: steps.build_decision.outputs.needs_build == 'false'
        run: |
          echo "没有需要构建的变更"
          exit 0

      # =========================
      # 6. sync upstream
      # =========================
      - name: Sync upstream repository
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}

          # 强制干净环境
          git reset --hard
          git clean -fdx

          OLD_HEAD=$(git rev-parse HEAD)

          if ! git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories; then

            echo "检测到 merge 冲突，自动处理..."

            # 先全部使用上游版本（解决 smartdns/dnsclient 等二进制冲突）
            git checkout --theirs . || true

            # 再恢复自己的自定义文件
            git checkout --ours \
              .github/workflows \
              cron_task.txt \
              build-custom.sh \
              README.md \
              Changelog.txt \
              fancyss/ss/ssconfig.sh \
              white_list.txt \
              black_list.txt \
              ss_update.sh \
              fancyss/scripts/ss_xray.sh \
              clear.py || true

            # add 全部
            git add -A

            # 提交冲突解决
            git commit -m "auto resolve merge conflicts"

          fi

          # merge 后恢复自定义文件（防止被上游覆盖）
          git restore --source=$OLD_HEAD \
            .github/workflows/ \
            cron_task.txt \
            README.md \
            Changelog.txt \
            fancyss/ss/ssconfig.sh \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            fancyss/scripts/ss_xray.sh \
            clear.py || true

      # =========================
      # 7. sync version files
      # =========================
      - name: Sync version files
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          set -e

          # packages version
          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o packages/version.json.js

          # build 真正读取的 runtime version
          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/fancyss/ss/version \
            -o fancyss/ss/version

          echo "===== packages/version.json.js ====="
          cat packages/version.json.js

          echo "===== fancyss/ss/version ====="
          cat fancyss/ss/version

      # =========================
      # 7.5. update changelog
      # =========================
      - name: Update Changelog for upstream version
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          set -euo pipefail

          VERSION=$(jq -r '.version' packages/version.json.js)
          git show upstream/3.0:Changelog.txt > /tmp/upstream_Changelog.txt

          python3 - "$VERSION" /tmp/upstream_Changelog.txt <<'PY'
          import datetime
          import pathlib
          import re
          import sys

          version, upstream_path = sys.argv[1], sys.argv[2]
          upstream_text = pathlib.Path(upstream_path).read_text(encoding="utf-8")
          path = pathlib.Path("Changelog.txt")
          local_text = path.read_text(encoding="utf-8") if path.exists() else "fancyss Changelog\n"

          # 保留上游该版本的完整日志段落（标题至下一版本标题之前）。
          lines = upstream_text.splitlines()
          heading = re.compile(r"^\s*" + re.escape(version) + r"(?:（[^）]*）|\([^)]*\))?\s*$")
          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)

          if start is not None:
              end = next(
                  (i for i in range(start + 1, len(lines))
                   if re.match(r"^\s*\d+\.\d+\.\d+(?:（[^）]*）|\([^)]*\))?\s*$", lines[i])),
                  len(lines)
              )
              new_section = "\n".join(lines[start:end]).strip()
          else:
              # 上游未提供对应版本日志时，至少留下准确版本记录，不伪造具体功能。
              date = datetime.datetime.now().strftime("%Y%m%d")
              new_section = (
                  f"{version}（{date}）\n"
                  "   - update\t同步上游版本；本次上游未提供对应版本的 Changelog 条目。"
              )

          if re.search(r"^\s*" + re.escape(version) + r"(?:（[^）]*）|\([^)]*\))?\s*$",
                       local_text, re.MULTILINE):
              print(f"Changelog already contains {version}; skip duplicate")
              raise SystemExit(0)

          # 插入到文件标题之后，保留此前所有本地版本记录。
          header, separator, body = local_text.partition("\n")
          if not separator:
              body = ""
          updated = header + "\n\n" + new_section + ("\n\n" + body.lstrip("\n") if body.strip() else "")
          path.write_text(updated.rstrip() + "\n", encoding="utf-8")
          print(f"Added upstream Changelog section for {version}")
          PY

          echo "===== New Changelog header ====="
          sed -n '1,35p' Changelog.txt

      # =========================
      # 8. install jq
      # =========================
      - name: Install jq
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # =========================
      # 9. patch rules
      # =========================
      - name: Patch ss_rule_update.sh
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' \
            fancyss/scripts/ss_rule_update.sh

      # =========================
      # 10. inject cron safely
      # =========================
      # - name: Inject cron_task safely
        # if: steps.build_decision.outputs.needs_build == 'true'
        # run: |
          # TARGET="fancyss/ss/ssconfig.sh"
      #
          # # 删除旧注入块（防止重复注入）
          # sed -i '/# CUSTOM_INJECT_START/,/# CUSTOM_INJECT_END/d' "$TARGET"
      #
          # # 重新注入
          # {
            # echo ""
            # echo "# CUSTOM_INJECT_START"
            # cat cron_task.txt
            # echo "# CUSTOM_INJECT_END"
          # } >> "$TARGET"
      #
      # # =========================
      # # 11. commit & push
      # # =========================
      - name: Commit & Push
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "sync upstream + auto patch"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
            echo "已提交并推送"
          else
            echo "没有变更，无需提交"
          fi

      # =========================
      # 12. synchronize version, commit and tag
      # =========================
      - name: Bump version and refresh release tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          LAST_SUBJECT=$(git log -1 --format=%s)
          if [[ "$LAST_SUBJECT" == "chore: changelog for v"* ]]; then
            VERSION=$(jq -r '.version' packages/version.json.js)
            echo "检测到仅补写 Changelog 的自动提交，不重复递增版本：$VERSION"
          elif git diff --quiet HEAD^ HEAD -- packages/version.json.js fancyss/ss/version; then
            VERSION=$(jq -r '.version' packages/version.json.js)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ || ! "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid version in packages/version.json.js: $VERSION"
              exit 1
            fi

            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            jq --arg version "$VERSION" '.version = $version' packages/version.json.js > /tmp/version.json.js
            mv /tmp/version.json.js packages/version.json.js
            printf '%s\n' "$VERSION" > fancyss/ss/version
            echo "自动递增版本至 $VERSION"
          else
            PACKAGE_VERSION=$(jq -r '.version' packages/version.json.js)
            RUNTIME_VERSION=$(tr -d '\r\n' < fancyss/ss/version)
            if [ "$PACKAGE_VERSION" != "$RUNTIME_VERSION" ]; then
              echo "Version mismatch: packages=$PACKAGE_VERSION runtime=$RUNTIME_VERSION"
              exit 1
            fi
            VERSION="$PACKAGE_VERSION"
            echo "本次提交已同步修改两个版本文件，使用版本 $VERSION"
          fi

          # 每个正式版本都必须有对应日志；上游同步步骤已生成的条目不会重复覆盖。
          python3 - "$VERSION" <<'PY'
          import datetime
          import pathlib
          import re
          import subprocess
          import sys

          version = sys.argv[1]
          path = pathlib.Path("Changelog.txt")
          content = path.read_text(encoding="utf-8") if path.exists() else "fancyss Changelog\n"
          heading = re.compile(
              r"^\s*" + re.escape(version) + r"(?:（[^）]*）|\([^)]*\))?\s*$",
              re.MULTILINE
          )
          if heading.search(content):
              print(f"Changelog already contains {version}; no duplicate entry")
              raise SystemExit(0)

          subjects = subprocess.check_output(
              ["git", "log", "-8", "--pretty=format:%s"], text=True
          ).splitlines()
          ignored = (
              "chore: bump version ",
              "chore: changelog for v",
              "chore: cache AnyTLS",
              "ci: ",
          )
          subjects = [s.strip() for s in subjects if s.strip() and not s.startswith(ignored)]

          date = datetime.datetime.now().strftime("%Y%m%d")
          entries = subjects[:8] or ["本次提交触发版本更新；详细改动可参阅仓库提交记录。"]
          section = [f"{version}（{date}）"]
          section.extend(f"   - update\t{s}" for s in entries)

          header, separator, body = content.partition("\n")
          if not separator:
              body = ""
          updated = header + "\n\n" + "\n".join(section)
          if body.strip():
              updated += "\n\n" + body.lstrip("\n")
          path.write_text(updated.rstrip() + "\n", encoding="utf-8")
          print(f"Generated Changelog entry for {version}")
          PY

          # 版本号和日志一起提交，避免产生额外的版本递增循环。
          git add packages/version.json.js fancyss/ss/version Changelog.txt
          if ! git diff --cached --quiet; then
            if git diff --cached --quiet -- packages/version.json.js fancyss/ss/version; then
              COMMIT_MESSAGE="chore: changelog for v$VERSION"
            else
              COMMIT_MESSAGE="chore: bump version to $VERSION"
            fi
            git commit -m "$COMMIT_MESSAGE"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          TAG_NAME="v$VERSION"
          git tag -f "$TAG_NAME" HEAD
          git push origin "refs/tags/$TAG_NAME" --force
          echo "已将 $TAG_NAME 更新到 $(git rev-parse --short HEAD)"
    # 11.5 自动刷新故障转移后节点列表
      - name: Auto refresh after failover
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          TARGET=$(find . -name "Module_shadowsocks.asp" | head -n1)

          echo "Found: $TARGET"

          python3 <<PY
          import re

          path = "$TARGET"

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          # 原代码块（保持不变，用于定位替换）
          old = '''function handle_ss_status_heartbeat(showRefreshPrompt) {
          	var dbus_post = {};
          	dbus_post["ss_heart_beat"] = "0";
          	push_data("dummy_script.sh", "", dbus_post, "2");
          	if (showRefreshPrompt) {
          		layer.confirm('<li>科学上网插件页面需要刷新！</li><br /><li>由于故障转移功能已经在后台切换了节点，为了保证页面显示正确配置！需要刷新此页面！</li><br /><li>确定现在刷新吗？</li>', {
          			time: 3e4,
          			shade: 0.8
          		}, function(index) {
          			layer.close(index);
          			refreshpage();
          		}, function(index) {
          			layer.close(index);
          			return false;
          		});
          	}
          }'''

          # 新代码块：引入 window.is_reloading 变量作为锁
          # 只有在没有进行刷新动作时 (!window.is_reloading) 才会触发刷新
          new = '''function handle_ss_status_heartbeat(showRefreshPrompt) {
          	var dbus_post = {};
          	dbus_post["ss_heart_beat"] = "0";
          	push_data("dummy_script.sh", "", dbus_post, "2");
          	if (showRefreshPrompt && !window.is_reloading) {
          		window.is_reloading = true;
          		setTimeout(function(){
          			refreshpage();
          		}, 500);
          	}
          }'''

          if old in data:
              data = data.replace(old, new)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(data)
              print("Patch success")
          else:
              print("Target function not found")
              exit(1)
          PY
      - name: Setup Go
        if: steps.build_decision.outputs.needs_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Build patched AnyTLS Go client
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          chmod +x binaries/anytls-go/build.sh
          ./binaries/anytls-go/build.sh

      - name: Save AnyTLS source fallback
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          if [ -s binaries/anytls-go/source.tar.gz ]; then
            git add binaries/anytls-go/source.tar.gz
            if ! git diff --cached --quiet; then
              git commit -m "chore: cache AnyTLS Go source fallback"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "已将 AnyTLS Go 源码快照保存到仓库"
            else
              echo "AnyTLS Go 源码快照无变化"
            fi
          else
            echo "ERROR: AnyTLS Go source fallback archive was not generated"
            exit 1
          fi

      # =========================
      # 12. build
      # =========================
      - name: Build packages
        if: steps.build_decision.outputs.needs_build == 'true'
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      # =========================
      # 13. release info
      # =========================
      - name: Generate release info
        if: steps.build_decision.outputs.needs_build == 'true'
        id: release_info
        run: |
          VERSION=$(jq -r '.version' packages/version.json.js)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version error"
            exit 1
          fi

          TAG_NAME="v${VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${VERSION}" >> $GITHUB_OUTPUT
          echo "body=构建时间：${BUILD_TIME}" >> $GITHUB_OUTPUT

      # =========================
      # 14. release
      # =========================
      - name: Create Release
        if: steps.build_decision.outputs.needs_build == 'true'
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          files: packages/*.tar.gz
          overwrite_files: true
          make_latest: true
          generate_release_notes: false

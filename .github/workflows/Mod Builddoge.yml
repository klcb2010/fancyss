name: FancySS Mod Build by klcb2010 doge

on:
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # =========================
      # 2. git config
      # =========================
      - name: Configure git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # =========================
      # 3. upstream
      # =========================
      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0 --no-tags

      # =========================
      # 4. version compare
      # =========================
      - name: Compare version
        id: compare_version
        run: |
          set -e

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o /tmp/up_version.json.js

          LOCAL_VERSION=$(jq -r '.version' packages/version.json.js)
          UPSTREAM_VERSION=$(jq -r '.version' /tmp/up_version.json.js)

          echo "local=$LOCAL_VERSION"
          echo "upstream=$UPSTREAM_VERSION"

          if [ "$(printf '%s\n%s' "$LOCAL_VERSION" "$UPSTREAM_VERSION" | sort -V | head -n1)" = "$LOCAL_VERSION" ] \
            && [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # 5. skip
      # =========================
      - name: Skip if no update
        if: steps.compare_version.outputs.needs_sync == 'false'
        run: |
          echo "已是最新版本"
          exit 0

      # =========================
      # 6. sync upstream
      # =========================
      - name: Sync upstream repository
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git checkout ${{ github.ref_name }}

          # 强制干净环境
          git reset --hard
          git clean -fdx

          OLD_HEAD=$(git rev-parse HEAD)

          if ! git merge upstream/3.0 -X theirs --no-edit --allow-unrelated-histories; then

            echo "检测到 merge 冲突，自动处理..."

            # 先全部使用上游版本
            git checkout --theirs . || true

            # 恢复自己的自定义文件
            git checkout --ours \
              .github/workflows \
              cron_task.txt \
              build-custom.sh \
              README.md \
              white_list.txt \
              black_list.txt \
              ss_update.sh \
              clear.py || true

            git add -A

            git commit -m "auto resolve merge conflicts"

          fi

          # merge 后恢复自定义文件
          git restore --source=$OLD_HEAD \
            .github/workflows/ \
            cron_task.txt \
            README.md \
            build-custom.sh \
            white_list.txt \
            black_list.txt \
            ss_update.sh \
            clear.py || true

      # =========================
      # 7. sync version files
      # =========================
      - name: Sync version files
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          set -e

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/packages/version.json.js \
            -o packages/version.json.js

          curl -sL https://raw.githubusercontent.com/hq450/fancyss/3.0/fancyss/ss/version \
            -o fancyss/ss/version

          echo "===== packages/version.json.js ====="
          cat packages/version.json.js

          echo "===== fancyss/ss/version ====="
          cat fancyss/ss/version

      # =========================
      # 8. install jq
      # =========================
      - name: Install jq
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # =========================
      # 9. patch rules
      # =========================
      - name: Patch ss_rule_update.sh
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' \
            fancyss/scripts/ss_rule_update.sh

      # =========================
      # 10. clone doge
      # =========================
      - name: Clone doge repo
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git clone --depth=1 https://github.com/folderdoge/fancyss_doge.git /tmp/doge

      # =========================
      # 11. sync doge core scripts
      # =========================
      - name: Sync doge core scripts
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          mkdir -p fancyss/scripts

          cp -af \
            /tmp/doge/fancyss/scripts/ss_chain_proxy.sh \
            fancyss/scripts/

          echo "=== 已同步 ss_chain_proxy.sh ==="

      # =========================
      # 12. sync doge UI
      # =========================
      - name: Sync doge UI
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          mkdir -p fancyss/webs
          mkdir -p fancyss/res

          cp -af \
            /tmp/doge/fancyss/webs/Module_shadowsocks.asp \
            fancyss/webs/

          cp -af \
            /tmp/doge/fancyss/res/ss-menu.js \
            fancyss/res/

          echo "=== 已同步 doge UI ==="

      # =========================
      # 13. inject doge hook
      # =========================
      - name: Dynamic Inject chain proxy hooks
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          TARGET="fancyss/ss/ssconfig.sh"

          echo "=== 开始注入 chain proxy ==="

          # 删除旧注入
          sed -i '/# DOGE_CHAIN_PROXY_START/,/# DOGE_CHAIN_PROXY_END/d' "$TARGET"

          # 创建 hook 文件
          printf '%s\n' \
          '# DOGE_CHAIN_PROXY_START' \
          '[ -f /koolshare/scripts/ss_chain_proxy.sh ] && . /koolshare/scripts/ss_chain_proxy.sh' \
          '# DOGE_CHAIN_PROXY_END' \
          > /tmp/doge_hook.txt

          # 注入 source hook
          sed -i '/source.*base.sh/r /tmp/doge_hook.txt' "$TARGET"

          # 注入 xray apply
          if ! grep -q "fss_chain_apply /koolshare/ss/xray.json" "$TARGET"; then
            sed -i '/xray.json/a fss_chain_apply /koolshare/ss/xray.json' "$TARGET"
          fi

          echo "=== chain proxy hook 注入完成 ==="

      # =========================
      # 14. ASUSGO
      # =========================
      - name: Dynamic Inject ASUSGO whitelist
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          TARGET="fancyss/ss/ssconfig.sh"

          if ! grep -q "ss_basic_direct_asusgo" "$TARGET"; then
            printf '\n# ASUSGO WHITE LIST\ndbus set ss_basic_direct_asusgo=1\n' >> "$TARGET"
          fi

          echo "=== ASUSGO 配置注入完成 ==="

      # =========================
      # 15. inject cron safely
      # =========================
      - name: Inject cron_task safely
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          TARGET="fancyss/ss/ssconfig.sh"

          sed -i '/# CUSTOM_INJECT_START/,/# CUSTOM_INJECT_END/d' "$TARGET"

          {
            echo ""
            echo "# CUSTOM_INJECT_START"
            cat cron_task.txt
            echo "# CUSTOM_INJECT_END"
          } >> "$TARGET"

      # =========================
      # 16. commit & push
      # =========================
      - name: Commit & Push
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "sync upstream + doge feature feed + auto patch"
            git push origin HEAD:${{ github.ref_name }} --force-with-lease
            echo "已提交并推送"
          else
            echo "没有变更，无需提交"
          fi

      # =========================
      # 17. build
      # =========================
      - name: Build packages
        if: steps.compare_version.outputs.needs_sync == 'true'
        run: |
          chmod +x build-custom.sh
          ./build-custom.sh

      # =========================
      # 18. release info
      # =========================
      - name: Generate release info
        if: steps.compare_version.outputs.needs_sync == 'true'
        id: release_info
        run: |
          VERSION=$(jq -r '.version' packages/version.json.js)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version error"
            exit 1
          fi

          TAG_NAME="v${VERSION}"
          BUILD_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=FancySS v${VERSION}" >> $GITHUB_OUTPUT
          echo "body=构建时间：${BUILD_TIME}" >> $GITHUB_OUTPUT

      # =========================
      # 19. release
      # =========================
      - name: Create Release
        if: steps.compare_version.outputs.needs_sync == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: ${{ steps.release_info.outputs.body }}
          files: packages/*.tar.gz
          overwrite_files: true
          make_latest: true
          generate_release_notes: false

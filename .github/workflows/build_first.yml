name: FancySS First Build

on:
  workflow_dispatch:   # 手动触发首次打包
  schedule:
    - cron: '0 3 */3 * *'  # 后续可以自动三天一次

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的 fork
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. 添加 upstream 并 fetch（可选）
      - name: Fetch upstream fancyss
        run: |
          git remote add upstream https://github.com/hq450/fancyss.git || true
          git fetch upstream 3.0
          git merge upstream/3.0 --ff-only || echo "No upstream updates"

      # 3. 构建插件
      - name: Build FancySS plugin
        run: |
          sh build.sh

      # 4. 上传多架构包到 Release mod
      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: mod
          name: FancySS mod build
          artifacts: |
            packages/fancyss_arm*.tar.gz
            packages/fancyss_x64*.tar.gz
            packages/fancyss_mips*.tar.gz
          allowUpdates: true
          makeLatest: true

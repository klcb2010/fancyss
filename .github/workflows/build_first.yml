name: FancySS Mod Build

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Patch ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 追加 cron_task.txt 到 ssconfig.sh（你的原有步骤）
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 新增：替换或追加自定义注入成功日志（加在启动完毕附近或末尾，确保执行）
      - name: Add custom injected tasks log message
        run: |
          # 方式1：如果有“启动完毕”行，直接替换成带自定义消息的版本（推荐，如果匹配得上）
          sed -i 's/echo_date.*启动完毕.*/echo_date "================== 系统及自定义任务已注入成功， cru l 查看 =================="/' fancyss/ss/ssconfig.sh || true

          # 方式2：如果上面没匹配到，就在文件末尾追加（保底）
          echo 'echo_date "================== 系统及自定义任务已注入成功， cru l 查看 =================="' >> fancyss/ss/ssconfig.sh

      # 5. 加执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh

      # 6. 执行打包，只保留 full 包
      - name: Build FancySS packages
        run: |
          ./build.sh
          find packages -type f ! -name "fancyss_hnd_full.tar.gz" ! -name "fancyss_hnd_v8_full.tar.gz" -delete

      # 7. 生成 release body
      - name: Generate release body
        run: |
          echo "Automated build $(date +%y%m%d): patched ss_rule_update.sh + ssconfig.sh cron + 自定义任务注入日志" > release_body.txt

      # 8. 创建/更新 Release
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: mod
          name: FancySS mod build
          body_path: release_body.txt
          make_latest: true
          generate_release_notes: false
          files: |
            packages/fancyss_hnd_full.tar.gz
            packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true

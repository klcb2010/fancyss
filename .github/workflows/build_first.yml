name: FancySS Mod Build

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点自动运行
  workflow_dispatch:     # 支持手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 安装 jq 工具（用于后续可能解析 JSON）
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. 修改 ss_rule_update.sh 中的规则地址
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # 4. 把 cron_task.txt 内容追加到 ssconfig.sh 末尾
      - name: Append cron_task.txt to ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      # 5. 给 build.sh 加执行权限
      - name: Make build.sh executable
        run: chmod +x build.sh

      # 6. 执行打包，只保留 hnd 和 hnd_v8 的 full 包
      - name: Build FancySS packages
        run: |
          ./build.sh
          # 删除其他不需要的包
          find packages -type f ! -name "fancyss_hnd_full.tar.gz" ! -name "fancyss_hnd_v8_full.tar.gz" -delete

      # 7. 生成 release 描述文件
      - name: Generate release body
        run: |
          echo "Automated build $(date +%y%m%d): patched ss_rule_update.sh + ssconfig.sh cron" > release_body.txt

      # 8. 创建或更新 Release，并上传文件（使用 PAT + 稳定版本 action）
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2.0.8  # 降级到 v2.0.8，避免 v2.5 的 finalize retry bug
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}  # 使用你已设置的 secret
        with:
          tag_name: mod
          name: FancySS mod build
          body_path: release_body.txt
          make_latest: true               # 设置为 latest release
          generate_release_notes: false   # 不自动生成 release notes
          files: |
            packages/fancyss_hnd_full.tar.gz
            packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true           # 允许覆盖已存在的同名文件

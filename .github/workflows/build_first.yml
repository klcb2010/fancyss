name: FancySS mod build

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨 3 点执行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tar gzip

      - name: Apply patches
        run: |
          # patch ss_rule_update.sh 第9行
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh
          # ssconfig.sh 末尾调用 cron_task.txt
          echo 'sh $(dirname "$0")/../../cron_task.txt' >> fancyss/ss/ssconfig.sh

      - name: Build only hnd/hnd_v8 full release packages
        run: |
          chmod +x fancyss/build.sh
          ./fancyss/build.sh

      - name: Prepare release artifacts
        run: |
          mkdir -p release_packages
          cp packages/fancyss_hnd_full.tar.gz release_packages/ || true
          cp packages/fancyss_hnd_v8_full.tar.gz release_packages/ || true

      - name: Set release body
        run: |
          echo "RELEASE_BODY=Automated build $(date +%y%m%d): patched ss_rule_update.sh + ssconfig.sh cron" >> $GITHUB_ENV

      - name: Create or Update Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod
          name: FancySS mod build
          body: ${{ env.RELEASE_BODY }}
          make_latest: true
          generate_release_notes: false
          files: release_packages/fancyss_hnd_full.tar.gz,release_packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ env.RELEASE_BODY }}

name: FancySS Mod Build

on:
  schedule:
    - cron: '0 3 * * *'  # 每天 3 点
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Run build script
        run: ./build.sh

      - name: Patch ss_rule_update.sh
        run: sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      - name: Insert cron_task.txt in ssconfig.sh
        run: |
          cat cron_task.txt >> fancyss/ss/ssconfig.sh

      - name: Write release body to file
        run: |
          echo "Automated build $(date +%y%m%d): patched ss_rule_update.sh + ssconfig.sh cron" > release_body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod
          files: |
            packages/fancyss_hnd_full.tar.gz
            packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true
          body_file: release_body.txt

name: FancySS First Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build FancySS
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show packages
        run: ls -lh packages

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: mod
          name: FancySS mod build
          artifacts: packages/*.tar.gz
          allowUpdates: true
          makeLatest: true

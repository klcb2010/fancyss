name: Build and Release FancySS mod

on:
  schedule:
    # 每天 03:00 UTC 同步、打包
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BODY: Automated build $(date +%y%m%d): patched ss_rule_update.sh + ssconfig.sh cron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Patch ss_rule_update.sh ---
      - name: Patch ss_rule_update.sh
        run: |
          sed -i '9s|.*|URL_MAIN="https://raw.githubusercontent.com/qxzg/Actions/3.0/fancyss_rules"|' fancyss/scripts/ss_rule_update.sh

      # --- Make build.sh executable ---
      - name: Make build.sh executable
        run: chmod +x build.sh

      # --- Run build ---
      - name: Run build.sh
        run: ./build.sh

      # --- Upload HND Full ---
      - name: Upload HND Full
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod
          files: packages/fancyss_hnd_full.tar.gz
          overwrite_files: true
          fail_on_unmatched_files: true
          body: ${{ env.RELEASE_BODY }}

      # --- Upload HND_V8 Full ---
      - name: Upload HND_V8 Full
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod
          files: packages/fancyss_hnd_v8_full.tar.gz
          overwrite_files: true
          fail_on_unmatched_files: true
          body: ${{ env.RELEASE_BODY }}

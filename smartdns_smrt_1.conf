# conf_ver: 20250404
# by: hq450
# mod by klcb2010 - 国内优先+黑名单强制代理强化版260318
# --------------------------------------------------------------------------------------------------
# 1. 此smartdns配置文件用于fancyss DNS分流解析，DNS解析行为：国内优先（默认用国内解析，黑名单/被墙域名走代理）
# 2. 具体：black_list（最优先）+ gfwlist + rotlist 由 gfw 组解析，chnlist + white_list + 其余由 chn 组解析
# 3. IPV6行为：开启 chn 组和 default 组的 IPV6 解析和优选，gfw 组域名强制关闭 IPV6 解析
# 4. 如果修改请确保配置文件的监听端口为 7913，修改配置后，你需要重启 smartdns 或整个插件生效。
# --------------------------------------------------------------------------------------------------

# 监听端口
bind [::]:7913

# ------------ domain-set ---------------------
domain-set -name chnlist -file /tmp/chnlist.txt
domain-set -name gfwlist -file /tmp/gfwlist.txt
domain-set -name rotlist -file /koolshare/ss/rules/rotlist.txt
domain-set -name white_list -file /tmp/white_list.txt
domain-set -name black_list -file /tmp/black_list.txt
domain-set -name block_list -file /tmp/block_list.txt

# ------------ domain-rules (分流策略强化区) ---------------------

# 1. block_list：完全屏蔽，不查询直接拦截
domain-rules /domain-set:block_list/ -c none -a #

# 2. black_list：最高优先级！强制走 gfw 组代理，彻底关闭 IPv6 解析，记录 ipset
domain-rules /domain-set:black_list/ -p #4:black_list,#6:- -c none -a #6 -n gfw

# 3. gfwlist & rotlist：强制走 gfw 组代理，关闭 IPv6 解析，关闭测速
domain-rules /domain-set:gfwlist/ -p #4:gfwlist,#6:- -c none -a #6 -n gfw
domain-rules /domain-set:rotlist/ -p #4:router,#6:- -c none -a #6 -n gfw

# 4. chnlist & white_list：国内直连，开启 IPv6 解析、测速及优选
domain-rules /domain-set:chnlist/ -p #4:chnlist,#6:chnlist6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn
domain-rules /domain-set:white_list/ -p #4:white_list,#6:white_list6 -c ping,tcp:80,tcp:443 -r first-ping -d yes -n chn

# 5. 默认规则：未匹配域名全部归入 chn 组（国内优先逻辑的核心）
# 保持默认组开启 IPv6 以获得最佳国内访问体验
domain-rules /./ -n chn

# ------------ 全局参数 ---------------------
# 国内优先模式下，开启测速模式以获得最快响应
speed-check-mode ping,tcp:80,tcp:443
response-mode first-ping

dualstack-ip-selection yes
dualstack-ip-selection-threshold 10

cache-persist yes
cache-file /tmp/smartdns_1.cache
prefetch-domain yes
serve-expired yes
serve-expired-ttl 259200
serve-expired-reply-ttl 3
cache-checkpoint-time 86400

# 默认不全局拦截 IPv6（因为要解析国内 IPv6），但拦截 HTTPS (Type 65) 查询加速解析
force-AAAA-SOA no
force-qtype-SOA 65

log-level info
log-file /tmp/smartdns_log.txt
log-size 2M
log-num 1
audit-enable yes
audit-file /tmp/smartdns_audit.txt
audit-size 2M
audit-num 1

ca-file /etc/ssl/certs/ca-certificates.crt

#--------------------------------
blacklist-ip 10.0.0.0/8
#--------------------------------

# define proxy server
proxy-server socks5://127.0.0.1:23456 -name fancy_proxy

# [chn 组] 国内上游服务器，承接 chnlist, white_list 及未匹配的域名
# 此组作为默认组，去掉了 -exclude-default-group
server 117.50.10.10 -group chn -blacklist-ip
server 117.50.60.30 -group chn -blacklist-ip
server 223.5.5.5 -group chn -blacklist-ip
server 119.29.29.29 -group chn -blacklist-ip
server 114.114.114.114 -group chn -blacklist-ip
server 180.184.1.1 -group chn -blacklist-ip
server 1.2.4.8 -group chn -blacklist-ip
server 180.76.76.76 -group chn -blacklist-ip

# [gfw 组] 国外上游服务器，走代理，仅用于 gfwlist, black_list, rotlist
# 显式使用 -exclude-default-group 防止被默认域名占用
server-tcp 8.8.8.8 -group gfw -exclude-default-group -proxy fancy_proxy
server-tcp 1.1.1.1 -group gfw -exclude-default-group -proxy fancy_proxy
